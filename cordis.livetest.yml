# Livetest overlay for the headless profile: point the deepseek adapter at
# LookatStudy's GLM (z.ai, OpenAI-compatible) endpoint and isolate the plugin's
# state file. The plugin itself is installed in the profile (dsh plugin add);
# its entry here only overrides config — `active: on` because headless has no
# dashboard route to click (the Config escape hatch).
# Key comes from the harness checkout's gitignored .env (Z_AI_API_KEY), exported in the run shell.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    baseURL: 'https://api.z.ai/api/coding/paas/v4'
    apiKeyEnv: Z_AI_API_KEY
    maxTokens: 65536
    models:
      - id: glm-5.2
        contextWindow: 128000
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: glm-5.2
- id: lookatstudy
  config:
    mode: guide
    active: on
    statePath: 'C:/Users/kaiji/vibecodingKJ/projects/dsh-plugin-lookatstudy/livetest-design-state.json'
